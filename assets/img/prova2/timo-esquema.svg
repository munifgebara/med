<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="800" height="560" fill="#ffffff"/>
  <text x="400" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Timo — lóbulo esquemático</text>

  <!-- Lobule outline -->
  <path d="M250 90 C120 110 90 220 110 300 C125 400 220 470 340 480 C460 470 540 400 520 300 C545 220 480 110 400 90 C360 80 290 80 250 90 Z"
        fill="#e7b7c9" stroke="#7a2e4a" stroke-width="4"/>

  <!-- Cortex (dense dots, outer band) -->
  <path d="M250 90 C120 110 90 220 110 300 C125 400 220 470 340 480 C460 470 540 400 520 300 C545 220 480 110 400 90 C360 80 290 80 250 90 Z"
        fill="#c76b94"/>

  <!-- Medulla (lighter inner region) -->
  <ellipse cx="320" cy="290" rx="150" ry="150" fill="#f3d4e2"/>

  <!-- dense dots in cortex only (clip via many small circles concentrated near border) -->
  <g fill="#6e1f42" opacity="0.8">
    <circle cx="180" cy="160" r="3"/><circle cx="195" cy="150" r="3"/><circle cx="210" cy="165" r="3"/>
    <circle cx="160" cy="190" r="3"/><circle cx="175" cy="205" r="3"/><circle cx="150" cy="220" r="3"/>
    <circle cx="140" cy="250" r="3"/><circle cx="155" cy="265" r="3"/><circle cx="135" cy="290" r="3"/>
    <circle cx="145" cy="320" r="3"/><circle cx="160" cy="340" r="3"/><circle cx="150" cy="355" r="3"/>
    <circle cx="175" cy="380" r="3"/><circle cx="195" cy="400" r="3"/><circle cx="215" cy="415" r="3"/>
    <circle cx="240" cy="430" r="3"/><circle cx="265" cy="445" r="3"/><circle cx="295" cy="455" r="3"/>
    <circle cx="330" cy="460" r="3"/><circle cx="365" cy="455" r="3"/><circle cx="395" cy="445" r="3"/>
    <circle cx="420" cy="430" r="3"/><circle cx="445" cy="412" r="3"/><circle cx="465" cy="392" r="3"/>
    <circle cx="482" cy="368" r="3"/><circle cx="495" cy="340" r="3"/><circle cx="500" cy="310" r="3"/>
    <circle cx="500" cy="280" r="3"/><circle cx="495" cy="250" r="3"/><circle cx="485" cy="220" r="3"/>
    <circle cx="470" cy="195" r="3"/><circle cx="450" cy="170" r="3"/><circle cx="425" cy="150" r="3"/>
    <circle cx="398" cy="135" r="3"/><circle cx="368" cy="125" r="3"/><circle cx="335" cy="118" r="3"/>
    <circle cx="300" cy="115" r="3"/><circle cx="270" cy="120" r="3"/><circle cx="240" cy="132" r="3"/>
    <circle cx="220" cy="140" r="3"/><circle cx="205" cy="175" r="2.5"/><circle cx="455" cy="240" r="2.5"/>
    <circle cx="130" cy="265" r="2.5"/><circle cx="475" cy="310" r="2.5"/>
  </g>

  <!-- sparse dots in medulla -->
  <g fill="#9a4a6e" opacity="0.6">
    <circle cx="300" cy="260" r="2.5"/><circle cx="340" cy="300" r="2.5"/><circle cx="280" cy="320" r="2.5"/>
    <circle cx="360" cy="250" r="2.5"/><circle cx="250" cy="280" r="2.5"/><circle cx="390" cy="290" r="2.5"/>
  </g>

  <!-- Hassall's corpuscle (concentric circles) in medulla -->
  <circle cx="330" cy="295" r="26" fill="#fff4e0" stroke="#b5841f" stroke-width="2.5"/>
  <circle cx="330" cy="295" r="18" fill="none" stroke="#b5841f" stroke-width="2"/>
  <circle cx="330" cy="295" r="10" fill="none" stroke="#b5841f" stroke-width="2"/>
  <circle cx="330" cy="295" r="3" fill="#b5841f"/>

  <!-- capillary at corticomedullary junction (hematothymic barrier) -->
  <path d="M225 230 q15 20 0 40" fill="none" stroke="#1d4e89" stroke-width="5" stroke-linecap="round"/>

  <!-- epithelial reticular cell marker in cortex (type I, near capillary) -->
  <circle cx="225" cy="230" r="6" fill="none" stroke="#1a7a3a" stroke-width="2.5"/>

  <!-- Labels -->
  <g font-size="17" fill="#1a1a1a">
    <line x1="150" y1="180" x2="60" y2="150" stroke="#333" stroke-width="1.5"/>
    <text x="10" y="135">Córtex tímico</text>
    <text x="10" y="156">(denso em timócitos)</text>

    <line x1="320" y1="290" x2="320" y2="500" stroke="#333" stroke-width="1.5"/>
    <text x="230" y="522">Medula tímica</text>
    <text x="230" y="543">(menos densa)</text>

    <line x1="356" y1="295" x2="560" y2="330" stroke="#333" stroke-width="1.5"/>
    <text x="565" y="325">Corpúsculo de Hassall</text>
    <text x="565" y="347">(céls. epiteliais tipo VI)</text>

    <line x1="225" y1="230" x2="80" y2="230" stroke="#333" stroke-width="1.5"/>
    <text x="10" y="215">Célula epitelial tipo I /</text>
    <text x="10" y="236">barreira hematotímica</text>

    <line x1="225" y1="250" x2="100" y2="300" stroke="#333" stroke-width="1.5"/>
    <text x="10" y="320">Capilar sanguíneo</text>
    <text x="10" y="341">(junção corticomedular)</text>
  </g>
</svg>
